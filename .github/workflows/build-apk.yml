name: Build APK

# Собирает НАСТОЯЩИЙ устанавливаемый .apk из index.html через Capacitor.
# Готовый файл — в артефакте VR123-apk. Если сборка упала, смотри артефакт
# VR123-buildlog: туда складывается весь вывод шагов.
#
# ВАЖНО: WebXR внутри такого apk работать не будет — в Android WebView его нет
# (спецификация W3C: "Android WebView None"). Для VR открывай index.html
# в Oculus Browser на шлеме.

on:
  workflow_dispatch:
  push:
    branches: [main]

# GITHUB_TOKEN по умолчанию read-only — без этого issue с логом не создаётся
permissions:
  contents: read
  issues: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Диагностика SDK
        run: |
          {
            echo "=== ANDROID_HOME ==="; ls -la "$ANDROID_HOME" 2>&1 || true
            echo "=== platforms ==="; ls "$ANDROID_HOME/platforms" 2>&1 || true
            echo "=== build-tools ==="; ls "$ANDROID_HOME/build-tools" 2>&1 || true
            echo "=== cmdline-tools ==="; ls "$ANDROID_HOME/cmdline-tools" 2>&1 || true
            echo "=== java ==="; java -version 2>&1 || true
            echo "=== node ==="; node -v; npm -v
          } | tee diag.txt
          # принимаем лицензии, иначе gradle встаёт на запросе
          SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM="$ANDROID_HOME/tools/bin/sdkmanager"
          if [ -x "$SM" ]; then yes | "$SM" --licenses >>diag.txt 2>&1 || true; fi

      - name: Capacitor-проект
        run: |
          # Capacitor не принимает webDir="." — нужен отдельный каталог
          mkdir -p build/app/www
          cp index.html build/app/www/index.html
          cd build/app
          {
            set -x
            npm init -y
            npm i @capacitor/core @capacitor/cli @capacitor/android
            npx cap init VR123 com.vr123.app --web-dir=www
            npx cap add android
            npx cap sync android
          } >>../../cap.txt 2>&1
          tail -40 ../../cap.txt
          # без pipefail: grep ничего не найдёт — шаг всё равно не должен падать
          grep -RhoE "compileSdk(Version)?[^0-9]*[0-9]+" android >>../../cap.txt 2>&1 || echo "compileSdk не нашёлся grep-ом"

      - name: Нужная платформа
        run: |
          NEED=$(grep -RhoE "compileSdk(Version)?[^0-9]*[0-9]+" build/app/android 2>/dev/null \
                 | grep -oE "[0-9]+" | sort -n | tail -1)
          NEED=${NEED:-35}
          echo "нужен android-$NEED"
          if [ ! -d "$ANDROID_HOME/platforms/android-$NEED" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM="$ANDROID_HOME/tools/bin/sdkmanager"
            "$SM" "platforms;android-$NEED" || echo "не доустановилось, пробуем собирать как есть"
          fi

      # Capacitor тянет kotlin-stdlib 1.8.22 и kotlin-stdlib-jdk8 1.6.21 —
      # "Duplicate class kotlin.streams.jdk8...". Лечится constraints.
      - name: Разрулить конфликт kotlin-stdlib
        run: |
          cat >> build/app/android/build.gradle <<'GRADLE'

          // фикс дублей классов kotlin-stdlib / kotlin-stdlib-jdk8
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
              }
          }
          GRADLE
          echo "--- хвост build.gradle ---"
          tail -15 build/app/android/build.gradle

      - name: gradlew assembleDebug
        working-directory: build/app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../../../gradle.txt
          exit ${PIPESTATUS[0]}

      - name: Что получилось
        if: always()
        run: |
          find build -name '*.apk' -exec ls -la {} \; 2>&1 | tee -a gradle.txt || true

      # артефакт с apk — только если собралось
      - uses: actions/upload-artifact@v4
        with:
          name: VR123-apk
          path: build/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # лог — всегда. Артефакты из песочницы не скачать (редирект на
      # blob.core.windows.net), поэтому дублируем лог issue'ем через API.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VR123-buildlog
          path: |
            diag.txt
            cap.txt
            gradle.txt
          if-no-files-found: ignore

      - name: Опубликовать лог issue'ем
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo; echo '### diag.txt'; echo '```'; tail -c 3000 diag.txt 2>/dev/null || echo "(нет)"; echo '```'
            echo; echo '### cap.txt'; echo '```'; tail -c 5000 cap.txt 2>/dev/null || echo "(нет)"; echo '```'
            echo; echo '### gradle.txt (хвост)'; echo '```'; tail -c 5000 gradle.txt 2>/dev/null || echo "(нет)"; echo '```'
          } > body.md
          # без || : если не создалось, шаг должен упасть и показать ошибку
          gh issue create --title "Build APK лог: run $GITHUB_RUN_ID" --body-file body.md 
