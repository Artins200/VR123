name: Build APK

# Собирает НАСТОЯЩИЙ устанавливаемый .apk из index.html через Capacitor.
# Запуск: вкладка Actions -> "Build APK" -> Run workflow (или пуш в main).
# Готовый файл скачивается в артефакте VR123-apk.
#
# ВАЖНО: WebXR внутри такого apk работать не будет — в Android WebView его нет
# (спецификация W3C: "Android WebView None"). Для VR открывай index.html
# в Oculus Browser на шлеме.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # SDK на ubuntu-latest предустановлен, эти пути подхватывает gradle
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Что уже есть в SDK (диагностика)
        run: |
          ls "$ANDROID_HOME" || echo "нет $ANDROID_HOME"
          echo "--- platforms ---"; ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          java -version
          # принимаем лицензии, иначе gradle остановится на запросе
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || \
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses >/dev/null 2>&1 || \
          echo "sdkmanager не найден — полагаемся на предустановленное"

      - name: Собрать Capacitor-проект
        run: |
          set -euo pipefail
          mkdir -p build/app
          cp index.html build/app/index.html
          cd build/app
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init VR123 com.vr123.app --web-dir=.
          npx cap add android
          npx cap sync android
          echo "--- какой compileSdk нужен ---"
          grep -RhoE "compileSdk(Version)? *= *[0-9]+" android --include=*.gradle --include=*.properties | sort -u

      - name: Добрать нужную платформу, если её нет
        run: |
          set -uo pipefail
          NEED=$(grep -RhoE "compileSdk(Version)? *= *[0-9]+" build/app/android --include=*.gradle --include=*.properties \
                 | grep -oE "[0-9]+" | sort -n | tail -1)
          NEED=${NEED:-35}
          echo "нужен android-$NEED"
          if [ ! -d "$ANDROID_HOME/platforms/android-$NEED" ]; then
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$SM" ] || SM="$ANDROID_HOME/tools/bin/sdkmanager"
            "$SM" "platforms;android-$NEED" || echo "не удалось доустановить android-$NEED"
          fi

      - name: gradlew assembleDebug
        working-directory: build/app/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Показать, что получилось
        run: |
          find build/app/android -name '*.apk' -exec ls -la {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: VR123-apk
          path: build/app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
